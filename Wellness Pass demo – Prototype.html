  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

<body>
  <div id="__bundler_placeholder">Loading Wellness Pass prototype...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"th\"><head><style data-dc-design-system-vars=\"\">@layer{:root{--forest:#12352b;--forest-2:#1b4637;--jade:#2f7d62;--jade-dark:#276b53;--sage:#9fcdb3;--turmeric:#e3a234;--turmeric-hover:#f0b44d;--on-turmeric:#2a1a00;--on-jade:#ffffff;--on-forest:#ffffff;--on-forest-muted:#c9ddd2;--page:#fbfaf6;--surface:#ffffff;--surface-soft:#f4f2ec;--sand:#efe9dd;--tint:#eef6f1;--tint-strong:#e1f0e7;--ink:#1a2420;--ink-2:#33413a;--muted:#5c6862;--line:#e0ddd4;--line-strong:#7a847e;--line-hover:#a9cdb9;--focus-ring:#276b53;--focus-ring-on-dark:#9fcdb3;--heart:#c8364b;--danger:#b42318;--danger-tint:#fdf1f0;--success:#0f6e52;--success-tint:#effaf5;--notice-bg:#fff8ec;--notice-line:#ecd3a0;--notice-text:#74500e;--shadow-sm:0 8px 24px rgba(18, 53, 43, 0.05);--shadow-card:0 10px 30px rgba(18, 53, 43, 0.07);--shadow-card-hover:0 24px 50px rgba(18, 53, 43, 0.13);--shadow-popover:0 22px 55px rgba(18, 53, 43, 0.2);--shadow-hero:0 30px 80px rgba(18, 53, 43, 0.18);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--space-section:72px;--shell:1180px;--control-h:48px;--field-h:52px;--radius-xs:9px;--radius-sm:12px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-2xl:30px;--radius-pill:999px;--layer-page-popover:25;--layer-site-header:30;--layer-header-popover:40;--layer-dialog:50;--font-sans:\"IBM Plex Sans Thai\", \"Noto Sans Thai\", Tahoma, Arial, sans-serif;--text-display:500 60px/1.18 var(--font-sans);--text-page-title:500 44px/1.25 var(--font-sans);--text-section-title:500 34px/1.3 var(--font-sans);--text-card-title:500 20px/1.45 var(--font-sans);--text-body:400 16px/1.75 var(--font-sans);--text-body-sm:400 14px/1.7 var(--font-sans);--text-price:600 20px/1.3 var(--font-sans);--text-eyebrow:600 13px/1.4 var(--font-sans);--text-label:500 13px/1.4 var(--font-sans);--text-micro:700 12px/1.4 var(--font-sans);}}<\u002Fstyle>\n<meta charset=\"utf-8\">\n<title>Wellness Pass prototype<\u002Ftitle>\n<script src=\"3a914a1a-fd47-4c0f-b45f-7499ec2c3bb0\"><\u002Fscript>\n<style>/* Wellness Pass demo site: tokens (from the Wellness Pass design system tokens.json) + page layout classes. */\n:root {\n  --forest: #12352b; --forest-2: #1b4637; --jade: #2f7d62; --jade-dark: #276b53; --sage: #9fcdb3;\n  --turmeric: #e3a234; --turmeric-hover: #f0b44d; --on-turmeric: #2a1a00; --on-jade: #ffffff;\n  --on-forest: #ffffff; --on-forest-muted: #c9ddd2;\n  --page: #fbfaf6; --surface: #ffffff; --surface-soft: #f4f2ec; --sand: #efe9dd; --tint: #eef6f1; --tint-strong: #e1f0e7;\n  --ink: #1a2420; --ink-2: #33413a; --muted: #5c6862;\n  --line: #e0ddd4; --line-strong: #7a847e; --line-hover: #a9cdb9;\n  --focus-ring: #276b53; --focus-ring-on-dark: #9fcdb3; --heart: #c8364b;\n  --danger: #b42318; --danger-tint: #fdf1f0; --success: #0f6e52; --success-tint: #effaf5;\n  --notice-bg: #fff8ec; --notice-line: #ecd3a0; --notice-text: #74500e;\n  --font-sans: \"IBM Plex Sans Thai\", \"Noto Sans Thai\", Tahoma, Arial, sans-serif;\n  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-section: 72px;\n  --shell: 1180px; --control-h: 48px; --field-h: 52px;\n  --radius-xs: 9px; --radius-sm: 12px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-2xl: 30px; --radius-pill: 999px;\n  --shadow-sm: 0 8px 24px rgba(18, 53, 43, 0.05); --shadow-card: 0 10px 30px rgba(18, 53, 43, 0.07);\n  --shadow-card-hover: 0 24px 50px rgba(18, 53, 43, 0.13); --shadow-popover: 0 22px 55px rgba(18, 53, 43, 0.2);\n  --shadow-hero: 0 30px 80px rgba(18, 53, 43, 0.18);\n  --layer-page-popover: 25; --layer-site-header: 30; --layer-header-popover: 40; --layer-dialog: 50;\n}\nhtml { scroll-behavior: smooth; scroll-padding-top: 96px; }\na { color: var(--jade-dark); }\na:hover { color: var(--forest); }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\n\n.s-page { min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.75; overflow-x: clip; }\n.s-shell { width: min(var(--shell), calc(100% - 40px)); margin-inline: auto; }\n@media (max-width: 520px) { .s-shell { width: calc(100% - 32px); } }\n.s-section { padding-block: var(--space-section); }\n.s-alt { background: var(--surface-soft); border-block: 1px solid var(--line); }\n@media (max-width: 760px) { .s-section { padding-block: 48px; } }\n\n.s-skip { position: absolute; left: 12px; top: -60px; z-index: 60; padding: 10px 16px; border-radius: var(--radius-sm); background: var(--forest); color: var(--on-forest); text-decoration: none; }\n.s-skip:focus { top: 12px; color: var(--on-forest); }\n\n/* Type */\n.s-eyebrow { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--jade-dark); line-height: 1.4; }\n.s-dark .s-eyebrow { color: var(--sage); }\n.s-display { margin: 0; font-size: 60px; line-height: 1.18; font-weight: 500; letter-spacing: -0.01em; color: var(--on-forest); }\n.s-page-title { margin: 0; font-size: 44px; line-height: 1.25; font-weight: 500; color: var(--on-forest); }\n.s-h1 { margin: 0; font-size: 40px; line-height: 1.25; font-weight: 500; color: var(--forest); }\n.s-h2 { margin: 0; font-size: 34px; line-height: 1.3; font-weight: 500; color: var(--forest); }\n.s-h3 { margin: 0; font-size: 20px; line-height: 1.45; font-weight: 500; color: var(--forest); }\n.s-lead { margin: 10px 0 0; max-width: 670px; color: var(--muted); }\n.s-dark .s-lead { color: var(--on-forest-muted); }\n.s-small { font-size: 14px; line-height: 1.7; color: var(--muted); }\n.s-tnum { font-variant-numeric: tabular-nums; }\n@media (max-width: 760px) { .s-display { font-size: 40px; } .s-page-title { font-size: 32px; } .s-h1 { font-size: 30px; } .s-h2 { font-size: 28px; } }\n\n/* Header */\n.s-header { position: sticky; top: 0; z-index: var(--layer-site-header); background: rgba(255, 255, 255, .92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(224, 221, 212, .9); font-family: var(--font-sans); }\n.s-header-in { display: flex; align-items: center; gap: 28px; height: 76px; }\n.s-brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 21px; font-weight: 600; color: var(--forest); letter-spacing: -0.01em; cursor: pointer; white-space: nowrap; }\n.s-nav { display: flex; gap: 26px; flex: 1; }\n.s-nav-link { position: relative; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 15px; color: var(--ink-2); cursor: pointer; }\n.s-nav-link:hover { color: var(--jade-dark); }\n.s-nav-link[aria-current=\"page\"] { color: var(--jade-dark); font-weight: 500; }\n.s-nav-link[aria-current=\"page\"]::after { content: \"\"; position: absolute; left: 0; right: 0; bottom: 4px; height: 2px; border-radius: 2px; background: var(--sage); }\n.s-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; }\n.s-lang { display: inline-flex; padding: 3px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface); }\n.s-lang button { min-width: 44px; min-height: 34px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }\n.s-lang button[aria-pressed=\"true\"] { background: var(--forest); color: var(--on-forest); }\n.wp-icon-btn.s-menu-btn { display: none; }\n.s-mobile-nav { display: none; }\n@media (max-width: 980px) {\n  .s-nav, .s-search-pill { display: none; }\n  .wp-icon-btn.s-menu-btn { display: inline-grid; }\n  .s-mobile-nav { display: grid; gap: 4px; padding: 8px 0 16px; border-top: 1px solid var(--line); }\n  .s-mobile-nav .s-nav-link { text-align: left; min-height: 48px; font-size: 16px; }\n}\n@media (max-width: 760px) { .s-header-in { height: 65px; gap: 12px; } }\n@media (max-width: 520px) { .s-header-in { height: 59px; } .s-brand { font-size: 18px; } }\n\n/* Forest bands */\n.s-band { position: relative; overflow: hidden; background: linear-gradient(125deg, var(--forest-2), var(--forest)); color: var(--on-forest); }\n.s-band::before { content: \"\"; position: absolute; right: -140px; top: -180px; width: 520px; height: 520px; border-radius: 50%; border: 1px solid rgba(159, 205, 179, .24); box-shadow: 0 0 0 70px rgba(159, 205, 179, .045), 0 0 0 140px rgba(159, 205, 179, .03); pointer-events: none; }\n.s-band > * { position: relative; }\n.s-header-slot { position: sticky; top: 0; z-index: var(--layer-site-header); }\n.s-band > .s-hero-img, .s-band > .s-hero-shade, .s-band > .s-hero-slides, .s-band > .s-hero-art { position: absolute; }\n/* Hero slideshow: three photos crossfade every 6s (18s loop) */\n.s-hero-slides { inset: 0; overflow: hidden; }\n.s-hero-slide { position: absolute; inset: 0; opacity: 0; animation: s-hero-fade 18s infinite; }\n.s-hero-slide .s-hero-img { position: absolute; animation: s-hero-zoom 18s infinite; }\n.s-slide-2, .s-slide-2 .s-hero-img { animation-delay: -12s; }\n.s-slide-3, .s-slide-3 .s-hero-img { animation-delay: -6s; }\n@keyframes s-hero-fade { 0% { opacity: 1; } 30% { opacity: 1; } 36% { opacity: 0; } 94% { opacity: 0; } 100% { opacity: 1; } }\n@keyframes s-hero-zoom { 0% { transform: scale(1); } 36% { transform: scale(1.06); } 94% { transform: scale(1); } 100% { transform: scale(1); } }\n.s-slide-1 { opacity: 1; }\n@media (prefers-reduced-motion: reduce) { .s-hero-slide, .s-hero-slide .s-hero-img { animation: none; } .s-slide-2, .s-slide-3 { opacity: 0; } .s-slide-1 { opacity: 1; } }\n.s-band > .s-shell { z-index: 1; }\n.s-hero-img { inset: 0; width: 100%; height: 100%; object-fit: cover; }\n.s-tr-img { object-position: center 58%; }\n.s-hero-shade { inset: 0; background: linear-gradient(90deg, rgba(18, 53, 43, .78) 0%, rgba(18, 53, 43, .45) 50%, rgba(18, 53, 43, .1) 100%), linear-gradient(180deg, rgba(18, 53, 43, .25), rgba(18, 53, 43, .45)); }\n.s-hero-art { left: 0; right: 0; bottom: 0; width: 100%; height: 170px; pointer-events: none; }\n.s-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }\n.s-hero { padding: 96px 0 150px; }\n.s-hero-sub { margin: 16px 0 32px; max-width: 600px; font-size: 18px; color: var(--on-forest-muted); }\n.s-inner-hero { padding: 64px 0 96px; }\n@media (max-width: 760px) { .s-hero { padding: 56px 0 72px; } .s-inner-hero { padding: 40px 0 80px; } }\n\n.s-panel { margin-top: 12px; max-width: 760px; box-sizing: border-box; padding: 20px 24px 24px; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-popover); color: var(--ink); }\n.s-panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }\n.s-chips { display: flex; flex-wrap: wrap; gap: 8px; }\n\n/* Section heading row */\n.s-head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 24px; margin-bottom: var(--space-12); }\n.s-head-row > div { max-width: 670px; }\n.s-head-row.s-center { justify-content: center; text-align: center; }\n.s-head-row.s-center .s-lead { margin-inline: auto; }\n.s-quiz-center, #quiz .wp-quiz { margin-inline: auto; }\n#quiz .s-head-row { margin-bottom: 20px; }\n.s-qprogress { width: 240px; height: 4px; margin: 0 auto 40px; border-radius: var(--radius-pill); background: var(--line); overflow: hidden; }\n.s-qprogress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--jade), var(--sage)); transition: width .22s ease; }\n.s-qgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }\n.s-qgroup { min-width: 0; margin: 0; padding: 20px; display: flow-root; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); }\n.s-qgroup legend { float: left; width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; margin: 0; padding: 0 0 16px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--forest); }\n.s-qnum { flex: none; min-width: 32px; height: 32px; padding: 0 6px; box-sizing: border-box; border-radius: var(--radius-pill); display: inline-grid; place-items: center; background: var(--tint-strong); color: var(--jade-dark); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }\n.s-qopts { clear: both; display: grid; gap: 10px; padding-top: 16px; }\n.s-qopt { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 16px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; text-align: left; cursor: pointer; transition: border-color .18s ease, background .18s ease, transform .18s ease; }\n.s-qopt:hover { border-color: var(--line-hover); background: var(--tint); transform: translateY(-1px); }\n.s-qopt .wp-icon { width: 22px; height: 22px; color: var(--jade); stroke-width: 1.6; }\n.s-qopt-label { flex: 1; }\n.s-qradio { width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); transition: border .18s ease; }\n.s-qopt[aria-pressed=\"true\"] { border-color: var(--jade); background: var(--tint); box-shadow: inset 0 0 0 1px var(--jade); color: var(--forest); font-weight: 500; }\n.s-qopt[aria-pressed=\"true\"] .s-qradio { border: 6px solid var(--jade); }\n.s-qresult { position: relative; overflow: hidden; display: flex; align-items: stretch; margin-top: 24px; min-height: 140px; border-radius: var(--radius-xl); border: 1px solid var(--line); background: linear-gradient(90deg, var(--surface) 40%, var(--tint)); }\n.s-qresult.is-done { border-color: var(--success); background: linear-gradient(90deg, var(--success-tint) 40%, var(--tint)); }\n.s-qresult-text { position: relative; z-index: 1; flex: 1; padding: 20px 24px; max-width: 640px; }\n.s-qresult-title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; font-weight: 500; color: var(--forest); }\n.s-qresult.is-done .s-qresult-title { color: var(--success); }\n.s-qresult-title .wp-icon { width: 18px; height: 18px; stroke-width: 2.4; }\n.s-qresult-body { margin: 4px 0 0; font-size: 14px; color: var(--muted); }\n.s-qresult-art { position: absolute; right: 0; bottom: 0; width: 360px; height: 100%; pointer-events: none; }\n@media (max-width: 980px) { .s-qgrid { grid-template-columns: 1fr; } .s-qresult-art { opacity: .35; } }\n#quiz .s-empty { display: none; }\n\n/* Grids */\n.s-grid-cats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--space-5); }\n.s-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }\n.s-grid-3 .wp-card { max-width: none; height: 100%; }\n.s-cardwrap { display: block; height: 100%; }\n.s-grid-cats .wp-cat { height: 100%; min-height: 156px; justify-items: center; align-content: center; gap: 12px; padding: 20px 12px; text-align: center; }\n.s-grid-cats .wp-cat-arrow { display: none; }\n.s-grid-cats .wp-cat-label { white-space: pre-line; min-height: 3em; display: grid; place-items: center; line-height: 1.5; }\n@media (max-width: 1120px) { .s-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (max-width: 980px) { .s-grid-cats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }\n@media (max-width: 760px) { .s-grid-3 { grid-template-columns: 1fr; } }\n@media (max-width: 520px) { .s-grid-cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n\n/* Cards and boxes */\n.s-card { box-sizing: border-box; padding: var(--space-8); border-radius: var(--radius-xl); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); }\n@media (max-width: 520px) { .s-card { padding: 20px; } }\n.s-empty { display: grid; justify-items: center; gap: 10px; padding: 48px 24px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-xl); background: var(--surface); color: var(--muted); }\n.s-icon-tile { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--tint-strong); color: var(--jade-dark); }\n.s-num-tile { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: var(--tint-strong); color: var(--jade-dark); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }\n\n/* Before you book: intro left, numbered checklist right */\n.s-check { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: center; }\n.s-check-intro { display: grid; gap: 4px; align-content: center; }\n.s-check-intro .s-lead { margin-bottom: 12px; }\n.s-check-meta { display: grid; gap: 8px; margin-bottom: 12px; font-size: 14px; color: var(--ink-2); }\n.s-check-meta span { display: flex; gap: 8px; align-items: flex-start; }\n.s-check-meta .wp-icon { width: 17px; height: 17px; margin-top: 4px; color: var(--jade); }\n.s-check-list { position: relative; display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }\n.s-check-list::before { content: \"\"; position: absolute; left: 49px; top: 40px; bottom: 40px; width: 2px; background: var(--line-hover); }\n.s-check-item { position: relative; display: grid; grid-template-columns: 50px minmax(0, 1fr) 52px; gap: 20px; align-items: center; padding: 24px; border-radius: var(--radius-xl); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .2s ease, border-color .2s ease; }\n.s-check-item:hover { transform: translateX(4px); border-color: var(--line-hover); }\n.s-check-item .s-num-tile { position: relative; z-index: 1; }\n.s-check-ico { width: 52px; height: 52px; border-radiu e-dark); }\n.wp-match ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }\n.wp-match li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.6; color: var(--ink-2); }\n.wp-match li .wp-icon { width: 15px; height: 15px; margin-top: 3px; color: var(--jade); stroke-width: 2.2; }\n.wp-match-note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }\n\n/* Preference quiz */\n.wp-quiz { border-radius: var(--radius-2xl); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); padding: var(--space-8); max-width: 760px; }\n.wp-progress { height: 4px; border-radius: var(--radius-pill); background: var(--surface-soft); overflow: hidden; margin-bottom: 24px; }\n.wp-progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--jade), var(--sage)); transition: width .22s ease; }\n.wp-quiz-q { margin: 0 0 10px; font-size: 15px; font-weight: 500; color: var(--forest); }\n.wp-quiz-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }\n.wp-quiz-opt { display: flex; gap: 10px; align-items: center; min-height: 56px; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 14px; text-align: left; cursor: pointer; transition: background .18s ease, border-color .18s ease; }\n.wp-quiz-opt:hover { background: var(--tint); }\n.wp-quiz-opt[aria-pressed=\"true\"] { border-color: var(--jade); background: var(--tint); box-shadow: inset 0 0 0 1px var(--jade); color: var(--forest); }\n.wp-quiz-opt .wp-icon { color: var(--jade); }\n.wp-quiz-result { border-radius: var(--radius-lg); border: 1px dashed var(--line-strong); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }\n.wp-quiz-result.is-done { border-style: solid; border-color: var(--success); background: var(--success-tint); color: var(--success); }\n.wp-quiz-reset { background: none; border: 0; padding: 0 4px; min-height: 40px; color: var(--jade-dark); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }\n@media (max-width: 640px) { .wp-quiz-opts { grid-template-columns: 1fr; } .wp-quiz { padding: var(--space-6); } }\n\n/* Time slot picker */\n.wp-slots { max-width: 520px; }\n.wp-slots-dur { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }\n.wp-slots-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }\n.wp-slot { min-height: 48px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer; transition: background .18s ease, border-color .18s ease; }\n.wp-slot:hover:not([aria-disabled=\"true\"]) { background: var(--tint); border-color: var(--jade); }\n.wp-slot[aria-pressed=\"true\"] { background: var(--jade); border-color: var(--jade); color: var(--on-jade); }\n.wp-slot[aria-disabled=\"true\"] { background: var(--surface-soft); border-style: dashed; color: var(--muted); text-decoration: line-through; cursor: not-allowed; }\n.wp-slots-note { margin: 12px 0 0; font-size: 13px; color: var(--muted); }\n\n/* Stepper */\n.wp-stepper { display: flex; gap: 0; list-style: none; margin: 0; padding: 0; counter-reset: step; }\n.wp-step { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }\n.wp-step::after { content: \"\"; flex: 1; height: 1px; background: var(--line); margin-right: 10px; }\n.wp-step:last-child::after { display: none; }\n.wp-step-dot { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }\n.wp-step[aria-current=\"step\"] { color: var(--forest); font-weight: 500; }\n.wp-step[aria-current=\"step\"] .wp-step-dot { background: var(--jade); border-color: var(--jade); color: var(--on-jade); }\n.wp-step.is-done .wp-step-dot { background: var(--tint-strong); border-color: var(--jade); color: var(--jade-dark); }\n.wp-step.is-done .wp-icon { width: 15px; height: 15px; stroke-width: 2.4; }\n\n/* Notice */\n.wp-notice { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius-lg); border: 1px solid; font-size: 14px; line-height: 1.65; max-width: 560px; }\n.wp-notice .wp-icon { margin-top: 3px; }\n.wp-notice-title { display: block; font-weight: 600; }\n.wp-notice-notice { background: var(--notice-bg); border-color: var(--notice-line); color: var(--notice-text); }\n.wp-notice-success { background: var(--success-tint); border-color: rgba(15, 110, 82, .28); color: var(--success); }\n.wp-notice-info { background: var(--tint); border-color: var(--line-hover); color: var(--jade-dark); }\n\n/* Money */\n.wp-money { display: inline-grid; gap: 2px; }\n.wp-money-main { font-size: 20px; font-weight: 600; color: var(--jade); font-variant-numeric: tabular-nums; line-height: 1.3; }\n.wp-money-unit { font-size: 13px; font-weight: 400; color: var(--muted); }\n.wp-money-est { font-size: 12px; color: var(--notice-text); font-variant-numeric: tabular-nums; }\n.wp-money-est.is-current { color: var(--success); }\n\n/* Consent */\n.wp-consent { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface); max-width: 560px; cursor: pointer; }\n.wp-consent input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--jade); flex: none; }\n.wp-consent-label { font-size: 14px; font-weight: 500; color: var(--ink); }\n.wp-consent-detail { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); line-height: 1.6; }\n\n/* FAQ */\n.wp-faq { border-bottom: 1px solid var(--line); max-width: 680px; }\n.wp-faq summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; padding: 8px 0; font-size: 16px; font-weight: 500; color: var(--forest); cursor: pointer; }\n.wp-faq summary::-webkit-details-marker { display: none; }\n.wp-faq summary .wp-icon { color: var(--jade); transition: transform .2s ease; }\n.wp-faq[open] summary .wp-icon { transform: rotate(45deg); }\n.wp-faq-body { padding: 0 0 16px; font-size: 15px; color: var(--ink-2); }\n<\u002Fstyle>\n<script src=\"b5aa8173-f4c4-42e5-b9d2-31a12e2f6a58\"><\u002Fscript>\n<script src=\"b6b7d15d-db9d-430c-8116-bcabf7bac1f3\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"4300\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"s-page\" style=\"width: 100%; min-height: 100vh;\" data-canvas-width=\"1280\" data-canvas-height=\"4300\" data-document-role=\"page\" data-label=\"Prototype (press Play)\">\n<sc-if value=\"{{isHome}}\" hint-placeholder-val=\"{{yes}}\">\n<dc-import name=\"Home\" lang=\"{{lang}}\" on-lang=\"{{setLang}}\" go=\"{{go}}\" answers=\"{{answers}}\" on-answers=\"{{setAnswers}}\" hint-size=\"100%,4300px\"><\u002Fdc-import>\n<\u002Fsc-if>\n<sc-if value=\"{{isTreatments}}\" hint-placeholder-val=\"{{no}}\">\n<dc-import name=\"Treatments\" lang=\"{{lang}}\" on-lang=\"{{setLang}}\" go=\"{{go}}\" initial-cat=\"{{filterCat}}\" start-date=\"{{startDate}}\" start-guests=\"{{startGuests}}\" start-party=\"{{startParty}}\" hint-size=\"100%,2300px\"><\u002Fdc-import>\n<\u002Fsc-if>\n<sc-if value=\"{{isDetail}}\" hint-placeholder-val=\"{{no}}\">\n<dc-import name=\"Detail\" lang=\"{{lang}}\" on-lang=\"{{setLang}}\" go=\"{{go}}\" treatment-id=\"{{treatmentId}}\" start-date=\"{{startDate}}\" start-guests=\"{{startGuests}}\" start-party=\"{{startParty}}\" hint-size=\"100%,3000px\"><\u002Fdc-import>\n<\u002Fsc-if>\n<sc-if value=\"{{isBooking}}\" hint-placeholder-val=\"{{no}}\">\n<dc-import name=\"Booking\" lang=\"{{lang}}\" on-lang=\"{{setLang}}\" go=\"{{go}}\" booking=\"{{booking}}\" contact=\"{{contact}}\" hint-size=\"100%,2700px\"><\u002Fdc-import>\n<\u002Fsc-if>\n<sc-if value=\"{{isCheckout}}\" hint-placeholder-val=\"{{no}}\">\n<dc-import name=\"Checkout\" lang=\"{{lang}}\" on-lang=\"{{setLang}}\" go=\"{{go}}\" booking=\"{{booking}}\" contact=\"{{contact}}\" hint-size=\"100%,1800px\"><\u002Fdc-import>\n<\u002Fsc-if>\n<sc-if value=\"{{isSuccess}}\" hint-placeholder-val=\"{{no}}\">\n<dc-import name=\"Success\" lang=\"{{lang}}\" on-lang=\"{{setLang}}\" go=\"{{go}}\" booking=\"{{booking}}\" contact=\"{{contact}}\" reference=\"{{reference}}\" method=\"{{method}}\" hint-size=\"100%,1400px\"><\u002Fdc-import>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4300}}\">\nclass Component extends DCLogic {\n  componentDidUpdate() {\n    try { document.documentElement.lang = (this.state && this.state.lang) || 'th'; } catch (e) {}\n  }\n  renderVals() {\n    const s = this.state || {};\n    const screen = s.screen || 'home';\n    const go = (scr, patch) => {\n      this.setState(Object.assign({}, patch || {}, { screen: scr }));\n      try { window.scrollTo(0, 0); } catch (e) {}\n    };\n    return {\n      yes: true,\n      no: false,\n      lang: s.lang || 'th',\n      setLang: (l) => this.setState({ lang: l }),\n      go: go,\n      answers: s.answers || {},\n      setAnswers: (a) => this.setState({ answers: a }),\n      filterCat: s.filterCat || 'all',\n      treatmentId: s.treatmentId || 'thai-traditional',\n      startDate: s.startDate || 0,\n      startGuests: s.startGuests || 1,\n      startParty: s.startParty || null,\n      booking: s.booking || null,\n      contact: s.contact || null,\n      reference: s.reference || '',\n      method: s.method || 'card',\n      isHome: screen === 'home',\n      isTreatments: screen === 'treatments',\n      isDetail: screen === 'detail',\n      isBooking: screen === 'booking',\n      isCheckout: screen === 'checkout',\n      isSuccess: screen === 'success'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
